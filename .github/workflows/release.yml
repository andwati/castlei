name: Release build and distribution
# Builds the signed Android APK and delivers it with Firebase App Distribution.
# Trigger: push a tag like v1.0.1, or run manually from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes
        required: false
        default: Manual build
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Restore signing key and Firebase config from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES_BASE64: ${{ secrets.KEY_PROPERTIES_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEY_PROPERTIES_BASE64" && test -n "$GOOGLE_SERVICES_JSON" \
            || { echo "Missing secrets: see docs/RELEASE.md"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > android/castlei-release.jks
          echo "$KEY_PROPERTIES_BASE64" | base64 -d > android/key.properties
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
      - run: ./tool/fetch_engine.sh
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build signed APKs (native crash symbols uploaded)
        env:
          ORG_GRADLE_PROJECT_uploadNativeSymbols: 'true'
        run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64
      - uses: actions/upload-artifact@v4
        with:
          name: castlei-release-apks
          path: build/app/outputs/flutter-apk/*-release.apk
      - name: Deliver to testers with Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: 1:PROJECT_NUMBER:android:REDACTED_APP_ID
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: owner
          file: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          releaseNotes: ${{ github.event.inputs.notes || github.ref_name }}
