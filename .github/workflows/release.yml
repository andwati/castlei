name: Release
# Cuts a GitHub Release from a version tag.
#   git tag -a v1.0.1 -m "Castlei 1.0.1" && git push origin v1.0.1
# The tag must match the version in pubspec.yaml (v1.0.1 for "version: 1.0.1+N";
# a suffix such as v1.0.1-rc.1 makes it a pre-release).
# Run it by hand (Actions tab -> Release -> Run workflow) for a dry run that
# builds and uploads the APKs as a workflow artifact without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release for the chosen ref (needs a v* tag ref)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Edit these in the repository settings (Settings > Secrets and variables > Actions >
# Variables). The text after || is the default used when a variable is not set.
env:
  FLUTTER_VERSION: ${{ vars.FLUTTER_VERSION || '3.47.9' }}
  FLUTTER_CHANNEL: ${{ vars.FLUTTER_CHANNEL || 'stable' }}
  JAVA_VERSION: ${{ vars.JAVA_VERSION || '17' }}
  ANDROID_TARGET_PLATFORMS: ${{ vars.ANDROID_TARGET_PLATFORMS || 'android-arm64,android-x64' }}
  # SHA-256 of the Castlei release signing certificate (public). The build fails if
  # the APKs are signed with anything else, for example the debug-key fallback.
  RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 || 'f285ee48cf321d2438b15aa9add26b319f6911de35cae05f6c4a74bd57a00d6a' }}
  FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
  FIREBASE_TEST_GROUP: ${{ vars.FIREBASE_TEST_GROUP || 'owner' }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Set to 'true' when the optional FIREBASE_SERVICE_ACCOUNT secret exists.
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so release notes can list the commits since the last tag

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Read the version and check it against the tag
        id: version
        run: |
          full=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          name=${full%%+*}
          build=${full##*+}
          echo "pubspec version: $name (build $build)"
          echo "name=$name"   >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ "$tag" != "v$name" && "$tag" != "v$name-"* ]]; then
              echo "::error::Tag $tag does not match pubspec.yaml version $name. Bump pubspec.yaml or retag."
              exit 1
            fi
            [[ "$tag" == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "tag=v$name-dry-run" >> "$GITHUB_OUTPUT"
          fi

      - name: Limit Gradle memory (the runner has about 7 GB)
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError" >> ~/.gradle/gradle.properties
          echo "org.gradle.workers.max=2" >> ~/.gradle/gradle.properties

      - name: Restore signing key and Firebase config from secrets
        env:
          FIREBASE_ENV_JSON: ${{ secrets.FIREBASE_ENV_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES_BASE64: ${{ secrets.KEY_PROPERTIES_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          for v in KEYSTORE_BASE64 KEY_PROPERTIES_BASE64 GOOGLE_SERVICES_JSON FIREBASE_ENV_JSON; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v (see docs/RELEASE.md)"; exit 1; fi
          done
          echo "$KEYSTORE_BASE64"       | base64 -d > android/castlei-release.jks
          echo "$KEY_PROPERTIES_BASE64" | base64 -d > android/key.properties
          echo "$GOOGLE_SERVICES_JSON"  | base64 -d > android/app/google-services.json
          echo "$FIREBASE_ENV_JSON"      | base64 -d > firebase.env.json
          chmod 600 android/castlei-release.jks android/key.properties firebase.env.json

      - run: ./tool/fetch_engine.sh
      - run: ./tool/retry.sh 3 20 flutter pub get
      - run: flutter analyze
      - run: ./tool/retry.sh 3 45 flutter test

      - name: Build signed release APKs (arm64 phones, x86_64 emulators)
        # The build downloads SQLite and the Kotlin compiler from GitHub; retry transient 504s.
        run: ./tool/retry.sh 3 60 flutter build apk --release --split-per-abi --target-platform ${{ env.ANDROID_TARGET_PLATFORMS }} --dart-define-from-file=firebase.env.json

      - name: Verify the APKs are signed with the release key
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/app-x86_64-release.apk; do
            got=$("$apksigner" verify --print-certs "$apk" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
            echo "$apk -> $got"
            if [ "$got" != "$RELEASE_CERT_SHA256" ]; then
              echo "::error::$apk is not signed with the Castlei release key"
              exit 1
            fi
          done

      - name: Collect release files
        run: |
          mkdir dist
          tag='${{ steps.version.outputs.tag }}'
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/castlei-$tag-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk   "dist/castlei-$tag-x86_64.apk"
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v7
        with:
          name: castlei-${{ steps.version.outputs.tag }}
          path: dist/*
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.version.outputs.tag }}'
          name='${{ steps.version.outputs.name }}'
          flags=()
          [ '${{ steps.version.outputs.prerelease }}' = 'true' ] && flags+=(--prerelease)
          cat > /tmp/notes.md <<EOF
          Castlei $name (build ${{ steps.version.outputs.build }}) for Android.

          - \`arm64-v8a\` is the build for current phones.
          - \`x86_64\` is for emulators.
          - Verify downloads with \`SHA256SUMS.txt\`. Both APKs are signed with the Castlei release key (certificate SHA-256 \`$RELEASE_CERT_SHA256\`).
          - Castlei includes open-source software (Stockfish, GPL-3.0). Source code and license notices are available on request; see the in-app Open-source software screen.

          ---
          EOF
          gh release create "$tag" dist/* --verify-tag --title "Castlei $name" \
            --notes-file /tmp/notes.md --generate-notes "${flags[@]}"

      - name: Deliver to testers with Firebase App Distribution (optional)
        if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish) && env.HAS_FIREBASE == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ env.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ env.FIREBASE_TEST_GROUP }}
          file: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          releaseNotes: Castlei ${{ steps.version.outputs.name }} (${{ steps.version.outputs.tag }})
