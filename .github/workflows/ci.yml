name: CI
# One CI run for the whole repository at a time. A new push cancels whatever is
# running and starts again on the new code. iOS is not built in CI yet (see
# docs/IOS.md); it returns when there is an iOS device and Apple account.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci
  cancel-in-progress: true

permissions:
  contents: read

# Edit these in the repository settings (Settings > Secrets and variables > Actions >
# Variables). The text after || is the default used when a variable is not set.
env:
  FLUTTER_VERSION: ${{ vars.FLUTTER_VERSION || '3.47.9' }}
  FLUTTER_CHANNEL: ${{ vars.FLUTTER_CHANNEL || 'stable' }}
  JAVA_VERSION: ${{ vars.JAVA_VERSION || '17' }}
  CI_ANDROID_PLATFORM: ${{ vars.CI_ANDROID_PLATFORM || 'android-arm64' }}

jobs:
  android:
    name: Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --no-git --source /repo --no-banner --redact
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Limit Gradle memory (the runner has about 7 GB)
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError" >> ~/.gradle/gradle.properties
          echo "org.gradle.workers.max=2" >> ~/.gradle/gradle.properties
      - name: Firebase config (secrets, or placeholders as a contributor build has)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_ENV_JSON: ${{ secrets.FIREBASE_ENV_JSON }}
        run: |
          ./tool/dev_setup.sh
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json; fi
          if [ -n "$FIREBASE_ENV_JSON" ]; then
            echo "$FIREBASE_ENV_JSON" | base64 -d > firebase.env.json
            echo "FIREBASE_DEFINES=--dart-define-from-file=firebase.env.json" >> "$GITHUB_ENV"
          fi
      - run: ./tool/retry.sh 3 20 flutter pub get
      - run: ./tool/fetch_engine.sh
      - run: cmake -S native -B build/native && cmake --build build/native -j 2
      - run: python3 tool/native_smoke.py
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - name: Unit and widget tests
        run: ./tool/retry.sh 3 45 flutter test
      - name: Build release APK (debug-signed here; signed releases come from the Release workflow)
        run: ./tool/retry.sh 3 45 flutter build apk --release --target-platform ${{ env.CI_ANDROID_PLATFORM }} $FIREBASE_DEFINES
      - uses: actions/upload-artifact@v4
        with:
          name: castlei-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
