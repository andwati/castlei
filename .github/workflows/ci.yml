name: CI
# One CI run for the whole repository at a time. A new push cancels whatever is
# running and starts again on the new code. Android runs first; iOS (a
# costly macOS runner) only starts after Android passes, never in parallel.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci
  cancel-in-progress: true

permissions:
  contents: read

# Edit these in the repository settings (Settings > Secrets and variables > Actions >
# Variables). The text after || is the default used when a variable is not set.
env:
  FLUTTER_VERSION: ${{ vars.FLUTTER_VERSION || '3.47.9' }}
  FLUTTER_CHANNEL: ${{ vars.FLUTTER_CHANNEL || 'stable' }}
  JAVA_VERSION: ${{ vars.JAVA_VERSION || '17' }}
  CI_ANDROID_PLATFORM: ${{ vars.CI_ANDROID_PLATFORM || 'android-arm64' }}

jobs:
  android:
    name: Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Firebase config (secret or placeholder)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          else
            cat > android/app/google-services.json <<'JSON'
          {"project_info":{"project_number":"0","project_id":"ci-placeholder"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.andwati.castlei"}},"api_key":[{"current_key":"placeholder"}]}],"configuration_version":"1"}
          JSON
          fi
      - run: ./tool/retry.sh 3 20 flutter pub get
      - run: ./tool/fetch_engine.sh
      - run: cmake -S native -B build/native && cmake --build build/native -j 2
      - run: python3 tool/native_smoke.py
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - name: Unit and widget tests
        run: ./tool/retry.sh 3 45 flutter test
      - name: Build release APK (debug-signed here; signed releases come from the Release workflow)
        run: ./tool/retry.sh 3 45 flutter build apk --release --target-platform ${{ env.CI_ANDROID_PLATFORM }}
      - uses: actions/upload-artifact@v4
        with:
          name: castlei-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS build and simulator tests
    needs: android
    runs-on: ${{ vars.IOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: ./tool/fetch_engine.sh
      - run: ./tool/retry.sh 3 20 flutter pub get
      - name: Build for the iOS simulator (no signing)
        run: ./tool/retry.sh 2 45 flutter build ios --simulator --no-codesign --debug
      - name: Boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Real Stockfish on the simulator
        run: flutter test integration_test/engine_play_test.dart -d "$SIM_UDID"
      - name: Core flows on the simulator
        run: flutter test integration_test/flows_test.dart -d "$SIM_UDID"
