name: Android and domain checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Firebase config (secret or placeholder)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          else
            cat > android/app/google-services.json <<'JSON'
          {"project_info":{"project_number":"0","project_id":"ci-placeholder"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.andwati.castlei"}},"api_key":[{"current_key":"placeholder"}]}],"configuration_version":"1"}
          JSON
          fi
      - run: flutter pub get
      - run: ./tool/fetch_engine.sh
      - run: cmake -S native -B build/native && cmake --build build/native -j 2
      - run: python3 tool/native_smoke.py
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - name: Build debug APK (retried, since the build downloads a prebuilt SQLite from GitHub)
        run: |
          for attempt in 1 2 3; do
            flutter build apk --debug --target-platform android-arm64 && exit 0
            echo "Build attempt $attempt failed; retrying in 30 s"; sleep 30
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: castlei-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
