name: iOS build and simulator tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: ./tool/fetch_engine.sh
      - run: flutter pub get
      - name: Build for the iOS simulator (no signing)
        run: flutter build ios --simulator --no-codesign --debug
      - name: Boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Real Stockfish on the simulator
        run: flutter test integration_test/engine_play_test.dart -d "$SIM_UDID"
      - name: Core flows on the simulator
        run: flutter test integration_test/flows_test.dart -d "$SIM_UDID"
